hydra:
  run:
    dir: ${output_dir}
  output_subdir: ${output_dir}/code/hydra           # Store hydra's config breakdown here for debugging
  searchpath:                                       # Only <exp_dir> in these paths are discoverable
    - pkg://navsim.planning.script.config.common
  job:
    chdir: False

defaults:
  - default_common
  - default_evaluation
  - all_train_val_test_log_split
  - agent: latent_wam_agent
  - _self_
  - override train_test_split: trainval

split: trainval
cache_path: ${oc.env:NAVSIM_EXP_ROOT}/cache
use_cache_without_dataset: true # load the training samples from the cache. scene-filter will be ignored
force_cache_computation: false
seed: 0
resume_ckpt_path: null
cache_sampler_mode: global
cache_shard_lru: 8
cache_staging_path: null
validate_cache_headers: false # cache generation validates shard structure; skip the redundant training-time scan

agent:
  build_target_encoder: true

dataloader:
  params:
    batch_size: 8  # per-device batch; 8 nodes x 8 devices x 8 samples = global batch 512
    num_workers: 12  # number of workers for data loading
    pin_memory: true  # pin memory for faster GPU transfer
    prefetch_factor: 1  # number of samples loaded in advance by each worker

trainer:
  params:
    max_epochs: 100  # maximum number of training epochs
    check_val_every_n_epoch: 1  # run validation set every n training epochs
    val_check_interval: 1.0  # [%] run validation set every X% of training set

    limit_train_batches: 1.0  # how much of training dataset to check (float = fraction, int = num_batches)
    limit_val_batches: 5  # monitor five batches from the validation subset, which is also used for training

    accelerator: gpu  # distribution method
    devices: 8 # GPUs per node
    strategy: ddp_find_unused_parameters_true # ddp
    precision: bf16-mixed  # floating point precision
    num_nodes: 8  # Number of nodes used for training

    num_sanity_val_steps: 0  # number of validation steps to run before training begins
    fast_dev_run: false  # runs 1 batch of train/val/test for sanity

    accumulate_grad_batches: 1  # accumulates gradients every n batches
    # track_grad_norm: -1  # logs the p-norm for inspection
    gradient_clip_val: 45.0  # value to clip gradients 默认为0.0
    gradient_clip_algorithm: norm  # [value, norm] method to clip gradients
    default_root_dir: ${output_dir}
    log_every_n_steps: 10  # how often to log within steps
