defaults:
  - default_common
  - default_dataset_paths
  - agent: latent_wam_agent
  - _self_
  - override train_test_split: trainval

cache_path: ${oc.env:NAVSIM_EXP_ROOT}/latent_wam_cache
force_cache_computation: false
distributed_dry_run: false
frames_per_shard: 64
extraction_batch_frames: 1

hydra:
  run:
    dir: ${cache_path}/metadata/rank_${oc.env:RANK,0}
  output_subdir: ${cache_path}/metadata/rank_${oc.env:RANK,0}/code/hydra
  searchpath:
    - pkg://navsim.planning.script.config.common
  job:
    chdir: false
