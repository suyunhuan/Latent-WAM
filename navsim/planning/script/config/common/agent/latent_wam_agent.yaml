_target_: navsim.agents.latent_wam.agent.LatentWAMAgent
_convert_: object

config:
  _target_: navsim.agents.latent_wam.config.LatentWAMConfig
  _convert_: object

  vision:
    _target_: navsim.agents.latent_wam.config.VisionConfig
    model_id: facebook/dinov2-base
    feature_dim: 768
    crop_height: 224
    crop_width: 448

  geometry:
    _target_: navsim.agents.latent_wam.config.GeometryConfig
    model_id: tencent/HunyuanWorld-Mirror
    feature_dim: 2048
    patch_start_index: 7

  transformer:
    _target_: navsim.agents.latent_wam.config.TransformerConfig
    model_dim: 256
    feedforward_dim: 1024
    num_layers: 4
    num_heads: 8
    dropout: 0.0

  trajectory:
    _target_: navsim.agents.latent_wam.config.TrajectoryConfig
    num_modes: 4
    time_horizon: 4.0
    interval_length: 0.5

  losses:
    _target_: navsim.agents.latent_wam.config.LossConfig
    trajectory: 1.0
    world_model: 0.2
    geometry: 0.1
    ego_status: 0.2

  data:
    _target_: navsim.agents.latent_wam.config.DataConfig
    time_offsets_s: [-1.5, 0.0, 2.0, 4.0]
    num_views: 3
    scene_tokens_per_view: 16
    schema_version: 1

  runtime:
    _target_: navsim.agents.latent_wam.config.RuntimeConfig
    strict_checkpoint: true

  training:
    _target_: navsim.agents.latent_wam.config.TrainingConfig
    learning_rate: 2.0e-4
    target_momentum: 0.999

checkpoint_path: null
build_target_encoder: false
